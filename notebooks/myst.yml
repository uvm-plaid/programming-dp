version: 1
project:
  id: programming-dp-en
  title: Programming Differential Privacy
  description: A practical introduction to programming differential privacy, with a focus on the Python programming language.
  authors:
    - name: Joseph P. Near
    - name: Chiké Abuah
  copyright: © 2025 Joseph P. Near and Chiké Abuah
  license:
    content: CC-BY-NC-SA-4.0
    code: MIT
  github: https://github.com/uvm-plaid/programming-dp
