          level: 0
        - file: chapter7.ipynb
          level: 0
        - file: chapter8.ipynb
          level: 0
        - file: chapter9.ipynb
          level: 0
        - file: chapter10.ipynb
          level: 0
        - file: chapter11.ipynb
          level: 0
        - file: chapter12.ipynb
          level: 0
        - file: chapter13.ipynb
          level: 0
        - file: chapter14.ipynb
          level: 0
        - file: chapter15.ipynb
