version: 1
project:
  id: programming-dp-cn
  title: 动手学差分隐私
  subtitle: 刘巍然、李双（译）
  description: 一本面向开发者的差分隐私书籍（A book about differential privacy, for programmers）
  authors:
    - name: Joseph P. Near
    - name: Chiké Abuah
  # translators
  contributors:
    - name: {literal: 刘巍然（Weiran Liu）, family: 刘, given: 巍然}
      github: liuweiran900217
    - name: {literal: 李双（Shuang Li）, family: 李, given: 双}
      github: little12
  copyright: © 2025 Joseph P. Near and Chiké Abuah
  license:
